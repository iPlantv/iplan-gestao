<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPlan Gestão</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230f2540'/><text y='.9em' font-size='65' x='12'>📊</text></svg>" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0a1628;
      --navy2: #0f2540;
      --navy3: #1a3a5c;
      --blue: #1e6bc4;
      --blue2: #4ab3f4;
      --green: #1D9E75;
      --green2: #EAF3DE;
      --red: #E24B4A;
      --red2: #FCEBEB;
      --amber: #BA7517;
      --amber2: #FAEEDA;
      --gray: #f4f3ef;
      --gray2: #e8e6e0;
      --gray3: #c8c5bc;
      --text: #1a1a1a;
      --text2: #5a5a5a;
      --text3: #9a9a9a;
      --white: #ffffff;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(10,22,40,0.10);
      --shadow-lg: 0 12px 48px rgba(10,22,40,0.18);
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--gray);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TELA DE ATIVAÇÃO / LOGIN ── */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy3) 100%);
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .auth-wrap::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(74,179,244,0.08) 0%, transparent 70%);
      top: -200px; right: -200px;
      pointer-events: none;
    }
    .auth-wrap::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(30,107,196,0.1) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }
    .auth-card {
      background: var(--white);
      border-radius: 20px;
      padding: 2.5rem;
      width: 420px;
      max-width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .auth-logo-icon {
      width: 48px; height: 48px;
      background: var(--navy2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .auth-logo-text { font-size: 22px; font-weight: 700; color: var(--navy2); }
    .auth-logo-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
    .auth-title { font-size: 18px; font-weight: 600; color: var(--navy2); margin-bottom: 6px; text-align: center; }
    .auth-sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 1.75rem; line-height: 1.6; }
    .auth-tabs { display: flex; background: var(--gray); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 1.5rem; }
    .auth-tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 6px; color: var(--text2); border: none; background: none; transition: all .2s; }
    .auth-tab.active { background: var(--white); color: var(--navy2); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field label { font-size: 12px; font-weight: 500; color: var(--text2); }
    .field input, .field select {
      height: 42px; border: 1.5px solid var(--gray2); border-radius: var(--radius-sm);
      padding: 0 14px; font-size: 14px; font-family: 'Sora', sans-serif;
      color: var(--text); background: var(--white); outline: none; transition: border .2s;
    }
    .field input:focus, .field select:focus { border-color: var(--blue); }
    .chave-input {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 15px !important;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }
    .btn-main {
      width: 100%; height: 44px; background: var(--navy2); color: var(--white);
      border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
      font-family: 'Sora', sans-serif; cursor: pointer; transition: all .2s; margin-top: 4px;
    }
    .btn-main:hover { background: var(--navy3); transform: translateY(-1px); }
    .auth-err { font-size: 12px; color: var(--red); text-align: center; margin-top: 8px; display: none; }
    .auth-ok { font-size: 12px; color: var(--green); text-align: center; margin-top: 8px; display: none; }
    .planos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .plano-card {
      border: 1.5px solid var(--gray2); border-radius: var(--radius-sm); padding: 12px 8px;
      text-align: center; cursor: pointer; transition: all .2s;
    }
    .plano-card.selected { border-color: var(--navy2); background: #f0f4f8; }
    .plano-card:hover { border-color: var(--navy3); }
    .plano-nome { font-size: 12px; font-weight: 600; color: var(--navy2); }
    .plano-preco { font-size: 18px; font-weight: 700; color: var(--navy2); margin: 4px 0; }
    .plano-info { font-size: 10px; color: var(--text3); }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--navy2); height: 56px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-icon { width: 34px; height: 34px; background: var(--navy3); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .topbar-title { color: var(--white); font-size: 15px; font-weight: 600; }
    .topbar-user { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .expiry-badge {
      font-size: 11px; padding: 4px 10px; border-radius: 99px; font-weight: 500;
    }
    .expiry-ok { background: rgba(29,158,117,0.2); color: #4adeab; }
    .expiry-warn { background: rgba(186,117,23,0.2); color: #fbbf24; }
    .expiry-dead { background: rgba(226,75,74,0.2); color: #f87171; }
    .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: rgba(255,255,255,0.7); font-size: 12px; padding: 5px 12px; cursor: pointer; font-family: 'Sora', sans-serif; }
    .btn-logout:hover { background: rgba(255,255,255,0.08); }

    /* ── TABS ── */
    .page-tabs { display: flex; background: var(--white); border-bottom: 1px solid var(--gray2); padding: 0 1.5rem; overflow-x: auto; }
    .page-tab { padding: 14px 16px; font-size: 13px; font-weight: 500; cursor: pointer; background: none; border: none; color: var(--text2); border-bottom: 2.5px solid transparent; white-space: nowrap; font-family: 'Sora', sans-serif; transition: all .2s; display: flex; align-items: center; gap: 6px; }
    .page-tab.active { color: var(--navy2); border-bottom-color: var(--navy2); }
    .page-tab:hover:not(.active) { color: var(--text); }

    /* ── CONTENT ── */
    .content { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }

    /* ── STATS ── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat { background: var(--white); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.3px; }
    .stat-value { font-size: 26px; font-weight: 700; color: var(--text); }
    .stat-value.g { color: var(--green); }
    .stat-value.a { color: var(--amber); }
    .stat-value.b { color: var(--blue); }
    .stat-value.r { color: var(--red); }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

    /* ── CARD ── */
    .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1.25rem; overflow: hidden; }
    .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--gray2); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .card-title { font-size: 14px; font-weight: 600; color: var(--navy2); display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 1.25rem; }

    /* ── FORM ── */
    .form-grid { display: grid; gap: 10px; align-items: end; margin-bottom: 12px; }
    .fg-5 { grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr; }
    .fg-cli { grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr; }
    .field-s { display: flex; flex-direction: column; gap: 4px; }
    .field-s label { font-size: 12px; font-weight: 500; color: var(--text2); }
    .field-s input, .field-s select {
      height: 38px; border: 1.5px solid var(--gray2); border-radius: var(--radius-sm);
      padding: 0 12px; font-size: 13px; font-family: 'Sora', sans-serif;
      color: var(--text); background: var(--white); outline: none; transition: border .2s;
    }
    .field-s input:focus, .field-s select:focus { border-color: var(--blue); }
    .preview-box {
      background: var(--gray); border-radius: var(--radius-sm); padding: 10px 14px;
      font-size: 13px; margin-bottom: 10px; border-left: 3px solid var(--navy2); display: none;
    }
    .form-err { font-size: 12px; color: var(--red); margin-top: 6px; display: none; }
    .btn { height: 38px; border: none; border-radius: var(--radius-sm); padding: 0 18px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: 'Sora', sans-serif; transition: all .15s; white-space: nowrap; }
    .btn-primary { background: var(--navy2); color: var(--white); }
    .btn-primary:hover { background: var(--navy3); }
    .btn-danger { background: var(--red); color: var(--white); }
    .btn-green { background: var(--green); color: var(--white); }
    .btn-sm { height: 30px; padding: 0 12px; font-size: 12px; }
    .btn-cancel-m { background: var(--gray); color: var(--text); border: 1px solid var(--gray2); }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { font-size: 11px; font-weight: 600; color: var(--text3); text-align: left; padding: 10px 1rem; background: var(--gray); border-bottom: 1px solid var(--gray2); letter-spacing: 0.4px; text-transform: uppercase; }
    td { font-size: 13px; color: var(--text); padding: 11px 1rem; border-bottom: 1px solid var(--gray2); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf7; }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
    .bg { background: var(--green2); color: var(--green); }
    .br { background: var(--red2); color: var(--red); }
    .ba { background: var(--amber2); color: var(--amber); }
    .bb { background: #E6F1FB; color: var(--blue); }
    .bp { background: #EEEDFE; color: #3C3489; }
    .bc { background: #E6F1FB; color: #185FA5; }

    /* ── INDICADORES ── */
    .ind { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .ig { background: var(--green); }
    .ir { background: var(--red); }
    .ia { background: var(--amber); }

    /* ── NOME CLI ── */
    .nc { display: flex; flex-direction: column; gap: 2px; }
    .nc-n { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .nc-t { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }

    /* ── AÇÕES ── */
    .actions { display: flex; gap: 4px; }
    .ic { background: none; border: 1px solid var(--gray2); border-radius: 7px; width: 28px; height: 28px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text2); font-size: 14px; transition: all .15s; }
    .ic:hover { background: var(--gray); color: var(--text); }
    .ic.del { border-color: #f5c0c0; color: var(--red); }
    .ic.del:hover { background: var(--red2); }
    .ic.ok { border-color: #b5dfc9; color: var(--green); }
    .ic.ok:hover { background: var(--green2); }
    .ic.back { border-color: var(--gray3); color: var(--text2); }

    /* ── PROG BAR ── */
    .prog { width: 100%; height: 7px; background: var(--gray); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .prog-fill { height: 100%; border-radius: 99px; }
    .pf-g { background: var(--green); }
    .pf-b { background: var(--navy2); }

    /* ── ALERT ── */
    .alert-box { background: var(--amber2); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; color: var(--amber); display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; font-weight: 500; }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 3rem; color: var(--text3); font-size: 14px; }

    /* ── CALCULOS ── */
    .mes-banner { background: linear-gradient(135deg, var(--navy2), var(--navy3)); border-radius: var(--radius); padding: 22px 28px; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .mes-title { color: var(--white); font-size: 16px; font-weight: 600; }
    .mes-sub { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 3px; }
    .mes-bar { height: 6px; background: rgba(255,255,255,0.2); border-radius: 99px; width: 220px; overflow: hidden; margin-top: 10px; }
    .mes-bar-fill { height: 100%; background: var(--blue2); border-radius: 99px; }
    .mes-valor { text-align: right; }
    .mes-valor-label { color: rgba(255,255,255,0.6); font-size: 11px; }
    .mes-valor-num { color: var(--white); font-size: 28px; font-weight: 700; }
    .mes-valor-sub { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 2px; }
    .calc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.25rem; }
    .calc-card { background: var(--white); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); text-align: center; }
    .calc-label { font-size: 11px; color: var(--text3); margin-bottom: 8px; font-weight: 500; letter-spacing: 0.3px; }
    .calc-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .calc-sub { font-size: 12px; color: var(--text2); }
    .calc-pct { font-size: 12px; font-weight: 600; margin-top: 8px; padding: 3px 10px; border-radius: 99px; display: inline-block; }
    .cp-g { background: var(--green2); color: var(--green); }
    .cp-r { background: var(--red2); color: var(--red); }
    .cp-a { background: var(--amber2); color: var(--amber); }
    .cp-b { background: #E6F1FB; color: var(--blue); }
    .calc-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 12px 1.25rem; border-bottom: 1px solid var(--gray2); }
    .calc-row:last-child { border-bottom: none; }
    .calc-row:hover { background: #fafaf7; }
    .calc-head { background: var(--gray); font-size: 11px; font-weight: 600; color: var(--text3); padding: 9px 1.25rem; display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr; gap: 8px; letter-spacing: 0.3px; text-transform: uppercase; }
    .circ { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin: 0 auto; }
    .circ-g { background: var(--green2); color: var(--green); border: 2px solid var(--green); }
    .circ-r { background: var(--red2); color: var(--red); border: 2px solid var(--red); }
    .circ-a { background: var(--amber2); color: var(--amber); border: 2px solid var(--amber); }
    .sec-title { font-size: 13px; font-weight: 600; color: var(--text2); margin: 1.25rem 0 0.75rem; display: flex; align-items: center; gap: 6px; letter-spacing: 0.3px; text-transform: uppercase; }

    /* ── MONTH GRID ── */
    .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .month-card { background: var(--gray); border-radius: var(--radius-sm); padding: 14px; text-align: center; cursor: pointer; transition: all .15s; border: 1.5px solid transparent; }
    .month-card:hover { background: var(--gray2); }
    .month-card.current { border-color: var(--navy2); }
    .month-name { font-size: 11px; color: var(--text3); margin-bottom: 6px; font-weight: 500; }
    .month-val { font-size: 16px; font-weight: 700; color: var(--navy2); }
    .month-rec { font-size: 11px; color: var(--green); margin-top: 3px; }
    .month-pend { font-size: 11px; color: var(--amber); }

    /* ── LEGEND ── */
    .legend { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--text3); }
    .legend span { display: flex; align-items: center; gap: 4px; font-weight: 500; }

    /* ── MODAL ── */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--white); border-radius: 16px; padding: 1.75rem; width: 440px; max-width: 100%; box-shadow: var(--shadow-lg); }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--navy2); }
    .modal-msg { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.7; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── ADMIN ── */
    .admin-badge { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: var(--white); font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 99px; letter-spacing: 0.5px; }
    .chave-mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 1px; color: var(--navy2); font-weight: 500; }
    .status-ativo { background: var(--green2); color: var(--green); }
    .status-pendente { background: var(--amber2); color: var(--amber); }
    .status-bloqueado { background: var(--red2); color: var(--red); }
    .status-expirado { background: var(--gray2); color: var(--text3); }

    /* ── PENDENTE SCREEN ── */
    .pendente-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--gray); }
    .pendente-card { background: var(--white); border-radius: 20px; padding: 3rem 2.5rem; text-align: center; max-width: 440px; box-shadow: var(--shadow-lg); }
    .pendente-icon { font-size: 48px; margin-bottom: 1rem; }
    .pendente-title { font-size: 20px; font-weight: 700; color: var(--navy2); margin-bottom: 8px; }
    .pendente-msg { font-size: 14px; color: var(--text2); line-height: 1.7; margin-bottom: 1.5rem; }

    /* EXPIRADO */
    .expirado-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--gray); }

    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .fg-5 { grid-template-columns: 1fr 1fr; }
      .fg-cli { grid-template-columns: 1fr 1fr; }
      .calc-grid { grid-template-columns: 1fr; }
      .month-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .content { padding: 1rem; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<!-- Modais -->
<div class="modal-bg" id="modal-del-cli">
  <div class="modal">
    <div class="modal-title">🗑️ Remover cliente</div>
    <div class="modal-msg" id="del-cli-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel-m" onclick="closeModal('modal-del-cli')">Cancelar</button>
      <button class="btn btn-danger" id="del-cli-ok">Remover</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="modal-del-venda">
  <div class="modal">
    <div class="modal-title">🗑️ Remover venda</div>
    <div class="modal-msg" id="del-venda-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel-m" onclick="closeModal('modal-del-venda')">Cancelar</button>
      <button class="btn btn-danger" id="del-venda-ok">Remover</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="modal-admin-action">
  <div class="modal">
    <div class="modal-title" id="admin-action-title"></div>
    <div class="modal-msg" id="admin-action-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel-m" onclick="closeModal('modal-admin-action')">Cancelar</button>
      <button class="btn btn-primary" id="admin-action-ok">Confirmar</button>
    </div>
  </div>
</div>

<script>
// =============================================

function fmtM(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtD(s){ if(!s) return '—'; const [y,m,d] = s.split('T')[0].split('-'); return `${d}/${m}/${y}`; }
function today(){ return new Date().toISOString().split('T')[0]; }
function mesAtual(){ return today().substring(0,7); }
function nomeMes(m){ return new Date(m+'-01').toLocaleDateString('pt-BR', {month:'long', year:'numeric'}); }
function addMonths(d, n){ const dt = new Date(d+'T00:00:00'); dt.setMonth(dt.getMonth()+n); return dt.toISOString().split('T')[0]; }
function fmtCPF(v){ const n=v.replace(/\D/g,'').slice(0,11); if(n.length<=3)return n; if(n.length<=6)return n.slice(0,3)+'.'+n.slice(3); if(n.length<=9)return n.slice(0,3)+'.'+n.slice(3,6)+'.'+n.slice(6); return n.slice(0,3)+'.'+n.slice(3,6)+'.'+n.slice(6,9)+'-'+n.slice(9); }
function tagG(g){ return g ? `<span class="badge bp">G: ${g}</span>` : ''; }
function tagC(c){ return c ? `<span class="badge bc">C: ${c}</span>` : ''; }
function getDeviceId(){ let id = localStorage.getItem('iplan_did'); if(!id){ id = 'did_'+Math.random().toString(36).substr(2,16)+'_'+Date.now(); localStorage.setItem('iplan_did', id); } return id; }
function gerarChave(){ const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; const seg=()=>Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join(''); return `IPLAN-${seg()}-${seg()}-${seg()}`; }
function diffDays(d){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d+'T00:00:00')-t)/86400000); }
function getIndicador(parc){ const t=parc.length; const r=parc.filter(p=>p.status==='recebido').length; if(r===t)return{cls:'ig',title:'Totalmente pago'}; if(r===0)return{cls:'ir',title:'Sem pagamento'}; return{cls:'ia',title:`${r}/${t} pagos`}; }
function legend(){ return `<div class="legend"><span><span class="ind ig"></span>Pago</span><span><span class="ind ia"></span>Parcial</span><span><span class="ind ir"></span>Pendente</span></div>`; }
function gerarParcelas(v){ const vc=(parseFloat(v.valor_carta)*parseFloat(v.percent_comissao))/100; const vp=vc/parseInt(v.parcelamento); const parc=[]; for(let i=0;i<parseInt(v.parcelamento);i++) parc.push({num:i+1,dataVenc:addMonths(v.data_venda,i),valor:vp,status:'pendente'}); return parc; }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

async function loadClientes(){
  if(!S.usuario) return;
  const r = await api(`iplan_clientes?usuario_id=eq.${S.usuario.id}&order=nome.asc`);
  if(r.ok) S.clientes = await r.json();
}
async function loadVendas(){
  if(!S.usuario) return;
  const r = await api(`iplan_vendas?usuario_id=eq.${S.usuario.id}&order=criado_em.desc`);
  if(r.ok) S.vendas = await r.json();
  // load parcelas
  for(const v of S.vendas){
    const rp = await api(`iplan_parcelas?venda_id=eq.${v.id}&order=num.asc`);
    if(rp.ok) S.parcelas[v.id] = await rp.json();
  }
}

function toggleAuthTab(t){
  document.getElementById('tab-login').classList.toggle('active', t==='login');
  document.getElementById('tab-ativar').classList.toggle('active', t==='ativar');
  document.getElementById('form-login').style.display = t==='login'?'block':'none';
  document.getElementById('form-ativar').style.display = t==='ativar'?'block':'none';
}

function fmtChaveInput(el){
  let v = el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  let out = 'IPLAN-';
  const body = v.replace(/^IPLAN/,'');
  const clean = body.replace(/[^A-Z0-9]/g,'');
  if(clean.length<=4) out += clean;
  else if(clean.length<=8) out += clean.slice(0,4)+'-'+clean.slice(4);
  else out += clean.slice(0,4)+'-'+clean.slice(4,8)+'-'+clean.slice(8,12);
  el.value = out;
}

async function verificarChave(){
  const chave = document.getElementById('a-chave').value.trim();
  const err = document.getElementById('a-err');
  const ok = document.getElementById('a-ok');
  err.style.display='none'; ok.style.display='none';
  if(chave.length < 19){ err.textContent='Chave inválida. Formato: IPLAN-XXXX-XXXX-XXXX'; err.style.display='block'; return; }
  const r = await api(`iplan_usuarios?chave=eq.${chave}&select=*`);
  if(!r.ok){ err.textContent='Erro ao verificar. Tente novamente.'; err.style.display='block'; return; }
  const data = await r.json();
  if(!data.length){ err.textContent='Chave não encontrada. Verifique e tente novamente.'; err.style.display='block'; return; }
  const u = data[0];
  if(u.status==='bloqueado'){ err.textContent='Esta chave foi bloqueada. Entre em contato com o suporte.'; err.style.display='block'; return; }
  if(u.login && u.login !== ''){ err.textContent='Esta chave já foi ativada. Faça login normalmente.'; err.style.display='block'; return; }
  ok.textContent='✅ Chave válida! Agora crie seu login e senha.';
  ok.style.display='block';
  setTimeout(()=>{ S.chaveAtivacao = chave; S.usuarioTemp = u; S.tela='cadastro'; render(); }, 1500);
}

async function fazerLogin(){
  const login = document.getElementById('l-login').value.trim();
  const senha = document.getElementById('l-senha').value.trim();
  const err = document.getElementById('l-err');
  err.style.display='none';

  // Admin?
  if(login === ADMIN_LOGIN && senha === ADMIN_SENHA){
    S.tela = 'admin'; S.adminAba = 'usuarios'; render(); return;
  }

  const r = await api(`iplan_usuarios?login=eq.${login}&senha=eq.${senha}&select=*`);
  if(!r.ok){ err.textContent='Erro de conexão. Tente novamente.'; err.style.display='block'; return; }
  const data = await r.json();
  if(!data.length){ err.textContent='Login ou senha incorretos.'; err.style.display='block'; return; }
  const u = data[0];

  if(u.status==='bloqueado'){ err.textContent='Conta bloqueada. Entre em contato com o suporte.'; err.style.display='block'; return; }
  if(u.status==='pendente'){ S.usuario=u; S.tela='pendente'; render(); return; }

  // Verificar expiração
  if(u.data_expiracao < today()){ S.usuario=u; S.tela='expirado'; render(); return; }

  // Verificar device
  const did = getDeviceId();
  if(u.device_id && u.device_id !== did){
    err.textContent='Esta conta já está ativada em outro dispositivo. Entre em contato com o suporte.';
    err.style.display='block'; return;
  }
  if(!u.device_id){
    await api(`iplan_usuarios?id=eq.${u.id}`, { method:'PATCH', body: JSON.stringify({device_id: did}) });
  }

  S.usuario = u;
  localStorage.setItem('iplan_login', login);
  S.tela = 'app';
  await loadClientes();
  await loadVendas();
  render();
}

async function finalizarCadastro(){
  const nome = document.getElementById('c-nome').value.trim();
  const login = document.getElementById('c-login').value.trim();
  const senha = document.getElementById('c-senha').value;
  const senha2 = document.getElementById('c-senha2').value;
  const err = document.getElementById('c-err');
  err.style.display='none';
  if(!nome){ err.textContent='Informe seu nome.'; err.style.display='block'; return; }
  if(!login || login.length < 4){ err.textContent='Login deve ter pelo menos 4 caracteres.'; err.style.display='block'; return; }
  if(!senha || senha.length < 6){ err.textContent='Senha deve ter pelo menos 6 caracteres.'; err.style.display='block'; return; }
  if(senha !== senha2){ err.textContent='Senhas não conferem.'; err.style.display='block'; return; }

  // Verificar se login já existe
  const rc = await api(`iplan_usuarios?login=eq.${login}&select=id`);
  if(rc.ok){ const ex = await rc.json(); if(ex.length){ err.textContent='Este login já está em uso. Escolha outro.'; err.style.display='block'; return; } }

  const u = S.usuarioTemp;
  const r = await api(`iplan_usuarios?id=eq.${u.id}`, {
    method: 'PATCH',
    body: JSON.stringify({ nome, login, senha, status: 'pendente' })
  });
  if(!r.ok){ err.textContent='Erro ao salvar. Tente novamente.'; err.style.display='block'; return; }
  S.tela = 'pendente';
  S.usuario = {...u, nome, login, senha, status:'pendente'};
  render();
}

  const dias = diffDays(u.data_expiracao);

  let expTxt = dias > 0 ? `Expira em ${dias}d (${fmtD(u.data_expiracao)})` : `Expirado`;

  const vendas = S.vendas;
  const todasP = vendas.flatMap(v => S.parcelas[v.id]||[]);
  const pendentes = todasP.filter(p=>p.status==='pendente');
  const hoje = today();
  const venc = pendentes.filter(p=>p.dataVenc<=hoje).length;

  let alert = '';
  if(venc>0) alert = `<div class="alert-box">🔔 Você tem <strong>${venc} parcela${venc>1?'s':''}</strong> para receber hoje ou em atraso!</div>`;

  else if(S.aba==='vendas') pane = renderVendas();
  else if(S.aba==='clientes') pane = renderClientes();
  else if(S.aba==='calendario') pane = renderCalendario();
  else if(S.aba==='calculos') pane = renderCalculos();

  document.getElementById('app').innerHTML = `

      <div class="topbar-left">

        <div>
          <div class="topbar-title">iPlan Gestão</div>

        </div>
      </div>
      <div class="topbar-right">

        <button class="btn-logout" onclick="logout()">Sair</button>

    </div>
    <div class="page-tabs">
      <button class="page-tab ${S.aba==='painel'?'active':''}" onclick="setAba('painel')">📊 Painel</button>
      <button class="page-tab ${S.aba==='vendas'?'active':''}" onclick="setAba('vendas')">💰 Vendas</button>
      <button class="page-tab ${S.aba==='clientes'?'active':''}" onclick="setAba('clientes')">👥 Clientes</button>
      <button class="page-tab ${S.aba==='calendario'?'active':''}" onclick="setAba('calendario')">📅 Calendário</button>

// =============================================
// PAINEL
// =============================================
function renderPainel(){
  const vendas = S.vendas;
  const todasP = vendas.flatMap(v=>S.parcelas[v.id]||[]);
  const totalC = todasP.reduce((a,p)=>a+p.valor,0);
  const totalR = todasP.filter(p=>p.status==='recebido').reduce((a,p)=>a+p.valor,0);
  const totalP = todasP.filter(p=>p.status==='pendente').reduce((a,p)=>a+p.valor,0);

  const rows = [...vendas].slice(0,5).map(v=>{
    const cli = S.clientes.find(c=>c.id===v.cliente_id);
    const parc = S.parcelas[v.id]||[];
    const r = parc.filter(p=>p.status==='recebido').length;
    const pct = parc.length ? Math.round(r/parc.length*100) : 0;
    const ind = getIndicador(parc);
    return `<tr>
      <td><div class="nc"><div class="nc-n"><span class="ind ${ind.cls}" title="${ind.title}"></span>${v.nome_cliente}</div><div class="nc-t">${tagG(cli?.grupo)}${tagC(cli?.cota)}</div></div></td>
      <td>${fmtM(v.valor_carta)}</td><td>${v.parcelamento}x</td><td style="font-weight:600;color:var(--navy2)">${fmtM(v.valor_comissao_total)}</td>
      <td><div style="font-size:11px;color:var(--text3)">${r}/${parc.length}</div><div class="prog"><div class="prog-fill pf-g" style="width:${pct}%"></div></div></td>
    </tr>`;}).join('');

  return `
    <div class="stats">
      <div class="stat"><div class="stat-label">TOTAL DE VENDAS</div><div class="stat-value b">${vendas.length}</div></div>
      <div class="stat"><div class="stat-label">TOTAL COMISSÕES</div><div class="stat-value">${fmtM(totalC)}</div></div>
      <div class="stat"><div class="stat-label">JÁ RECEBIDO</div><div class="stat-value g">${fmtM(totalR)}</div></div>
      <div class="stat"><div class="stat-label">A RECEBER</div><div class="stat-value a">${fmtM(totalP)}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">🕐 Últimas vendas</div>${legend()}</div>
      <div class="table-wrap"><table>
        <thead><tr><th style="width:180px">Cliente</th><th>Carta</th><th>Parcelas</th><th>Comissão</th><th style="width:150px">Progresso</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="5"><div class="empty">Nenhuma venda cadastrada ainda</div></td></tr>`}</tbody>
      </table></div>
    </div>`;
}

function renderVendas(){
  const clientes = S.clientes;
  const vendas = S.vendas;
  const optCli = clientes.map(c=>{
    const ex=[c.grupo?`G:${c.grupo}`:'',c.cota?`C:${c.cota}`:''].filter(Boolean).join(' | ');
    return `<option value="${c.id}">${c.nome}${ex?' — '+ex:''}`;
  }).join('');

  let filtradas = [...vendas];
  if(S.filtroVenda==='ativo') filtradas = filtradas.filter(v=>(S.parcelas[v.id]||[]).some(p=>p.status==='pendente'));
  if(S.filtroVenda==='concluido') filtradas = filtradas.filter(v=>(S.parcelas[v.id]||[]).every(p=>p.status==='recebido'));

  const rows = filtradas.map(v=>{
    const cli = clientes.find(c=>c.id===v.cliente_id);
    const parc = S.parcelas[v.id]||[];
    const pends = parc.filter(p=>p.status==='pendente');
    const recs = parc.filter(p=>p.status==='recebido');
    const prox = [...pends].sort((a,b)=>a.dataVenc.localeCompare(b.dataVenc))[0];
    const ind = getIndicador(parc);
    const vp = parc[0]?.valor||0;
    return `<tr>

function bindVendaEvents(){
  const vc=document.getElementById('v-carta');const vp=document.getElementById('v-pct');const vpa=document.getElementById('v-parc');const prev=document.getElementById('v-prev');
  function calc(){
    if(!vc||!vp||!vpa||!prev)return;
    const carta=parseFloat(vc.value||0);const pct=parseFloat(vp.value||0);const parc=parseInt(vpa.value||0);
    if(carta>0&&pct>0&&parc>0){const total=(carta*pct)/100;prev.innerHTML=`💰 <strong>Comissão total: ${fmtM(total)}</strong> &nbsp;|&nbsp; ${parc}x de <strong>${fmtM(total/parc)}</strong>/mês`;prev.style.display='block';}
    else prev.style.display='none';
  }
  if(vc)vc.addEventListener('input',calc);if(vp)vp.addEventListener('input',calc);if(vpa)vpa.addEventListener('input',calc);
}

async function addVenda(){
  const cliId = parseInt(document.getElementById('v-cli')?.value);
  const carta = parseFloat(document.getElementById('v-carta')?.value||0);
  const pct = parseFloat(document.getElementById('v-pct')?.value||0);
  const parc = parseInt(document.getElementById('v-parc')?.value||0);
  const data = document.getElementById('v-data')?.value;
  const err = document.getElementById('err-venda');
  const cli = S.clientes.find(c=>c.id===cliId);
  if(!cli){err.textContent='Selecione um cliente.';err.style.display='block';return;}
  if(!carta||carta<=0){err.textContent='Informe o valor da carta.';err.style.display='block';return;}
  if(!pct||pct<=0){err.textContent='Informe o percentual de comissão.';err.style.display='block';return;}
  if(!parc||parc<1){err.textContent='Informe o número de parcelas.';err.style.display='block';return;}
  if(!data){err.textContent='Informe a data da venda.';err.style.display='block';return;}
  err.style.display='none';
  const valorComissaoTotal = (carta*pct)/100;
  const rv = await api('iplan_vendas', {
    method:'POST',
    body: JSON.stringify({
      usuario_id: S.usuario.id, cliente_id: cliId, nome_cliente: cli.nome,
      valor_carta: carta, percent_comissao: pct, valor_comissao_total: valorComissaoTotal,
      parcelamento: parc, data_venda: data
    })
  });
  if(!rv.ok){err.textContent='Erro ao salvar venda.';err.style.display='block';return;}
  const venda = (await rv.json())[0];
  // Criar parcelas
  const parcelas = gerarParcelas({...venda, data_venda: data});
  for(const p of parcelas){
    await api('iplan_parcelas', { method:'POST', prefer:'return=minimal', body: JSON.stringify({venda_id: venda.id, num:p.num, data_venc:p.dataVenc, valor:p.valor, status:'pendente'})});
  }
  await loadVendas();
  renderApp();
}

function verParcelas(vid){
  const v = S.vendas.find(x=>x.id===vid); if(!v) return;
  const cli = S.clientes.find(c=>c.id===v.cliente_id);
  const parc = S.parcelas[vid]||[];
  const card = document.getElementById('parc-card');
  const title = document.getElementById('parc-title');
  const tbl = document.getElementById('parc-table');
  if(!card)return;
  title.innerHTML = `📋 Parcelas — ${v.nome_cliente} ${tagG(cli?.grupo)} ${tagC(cli?.cota)}`;
  const rows = parc.map((p,i)=>{
    const sc = p.status==='recebido'?'bg':p.status==='cancelado'?'br':'ba';
    const sl = p.status==='recebido'?'Recebido':p.status==='cancelado'?'Cancelado':'Pendente';
    return `<tr>
      <td>Parcela ${p.num}</td>
      <td>${fmtD(p.data_venc)}</td>
      <td style="font-weight:600;color:var(--navy2)">${fmtM(p.valor)}</td>
      <td><span class="badge ${sc}">${sl}</span></td>
      <td><div class="actions">
        ${p.status==='pendente'?`<button class="ic ok" onclick="marcarP(${vid},${p.id},'recebido')">✅</button>`:''}
        ${p.status==='recebido'?`<button class="ic back" onclick="marcarP(${vid},${p.id},'pendente')">↩️</button>`:''}
        ${p.status!=='cancelado'?`<button class="ic del" onclick="marcarP(${vid},${p.id},'cancelado')">❌</button>`:''}
      </div></td>
    </tr>`;}).join('');
  tbl.innerHTML=`<thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th><th style="width:100px">Ações</th></tr></thead><tbody>${rows}</tbody>`;
  card.style.display='block';
  card.scrollIntoView({behavior:'smooth',block:'start'});
}

async function marcarP(vid, pid, status){
  await api(`iplan_parcelas?id=eq.${pid}`,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({status})});
  const rp = await api(`iplan_parcelas?venda_id=eq.${vid}&order=num.asc`);
  if(rp.ok) S.parcelas[vid] = await rp.json();
  renderApp();
  setTimeout(()=>verParcelas(vid),50);
}

function openDelVenda(id){
  const v=S.vendas.find(x=>x.id===id);if(!v)return;
  document.getElementById('del-venda-msg').textContent=`Remover a venda de "${v.nome_cliente}" (${fmtM(v.valor_comissao_total)})?`;
  document.getElementById('del-venda-ok').onclick=async()=>{
    await api(`iplan_vendas?id=eq.${id}`,{method:'DELETE',prefer:'return=minimal'});
    delete S.parcelas[id];
    S.vendas=S.vendas.filter(x=>x.id!==id);
    closeModal('modal-del-venda');renderApp();
  };
  document.getElementById('modal-del-venda').classList.add('open');
}

function renderCalendario(){
  const vendas=S.vendas;const clientes=S.clientes;
  const todasP=vendas.flatMap(v=>{const cli=clientes.find(c=>c.id===v.cliente_id);return(S.parcelas[v.id]||[]).map(p=>({...p,nomeCliente:v.nome_cliente,grupo:cli?.grupo||'',cota:cli?.cota||''}));});
  const hoje=today();const ma=mesAtual();
  const meses={};
  todasP.forEach(p=>{const m=p.data_venc?.substring(0,7);if(!m)return;if(!meses[m])meses[m]={total:0,recebido:0,pendente:0};meses[m].total+=p.valor;if(p.status==='recebido')meses[m].recebido+=p.valor;if(p.status==='pendente')meses[m].pendente+=p.valor;});
  const mo=Object.keys(meses).sort();
  const pendH=todasP.filter(p=>p.data_venc<=hoje&&p.status==='pendente');
  let alert='';if(pendH.length>0){const t=pendH.reduce((a,p)=>a+p.valor,0);alert=`<div class="alert-box">🔔 <strong>${pendH.length} parcela${pendH.length>1?'s':''}</strong> para receber hoje ou em atraso — ${fmtM(t)}</div>`;}
  if(!mo.length)return`<div class="card"><div class="card-body"><div class="empty">Cadastre vendas para ver o calendário.</div></div></div>`;
  const cards=mo.map(m=>{const d=meses[m];return`<div class="month-card ${m===ma?'current':''}" onclick="expandirMes('${m}')"><div class="month-name">${new Date(m+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div><div class="month-val">${fmtM(d.total)}</div><div class="month-rec">✅ ${fmtM(d.recebido)}</div><div class="month-pend">⏳ ${fmtM(d.pendente)}</div></div>`;}).join('');
  return `${alert}
    <div class="card"><div class="card-header"><div class="card-title">📅 Previsão de recebimentos</div></div><div class="card-body"><div class="month-grid">${cards}</div></div></div>
    <div class="card" id="mes-detalhe" style="display:none"><div class="card-header"><div class="card-title" id="mes-title"></div></div><div class="table-wrap"><table id="mes-table"></table></div></div>`;
}

function expandirMes(m){
  const vendas=S.vendas;const clientes=S.clientes;
  const parc=vendas.flatMap(v=>{const cli=clientes.find(c=>c.id===v.cliente_id);return(S.parcelas[v.id]||[]).map(p=>({...p,nomeCliente:v.nome_cliente,grupo:cli?.grupo||'',cota:cli?.cota||''}));}).filter(p=>p.data_venc?.startsWith(m));
  const card=document.getElementById('mes-detalhe');const title=document.getElementById('mes-title');const tbl=document.getElementById('mes-table');if(!card)return;
  title.textContent=new Date(m+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const rows=parc.sort((a,b)=>a.data_venc.localeCompare(b.data_venc)).map(p=>{const sc=p.status==='recebido'?'bg':p.status==='cancelado'?'br':'ba';const sl=p.status==='recebido'?'Recebido':p.status==='cancelado'?'Cancelado':'Pendente';return`<tr><td>${fmtD(p.data_venc)}</td><td><div class="nc"><div class="nc-n">${p.nomeCliente}</div><div class="nc-t">${tagG(p.grupo)}${tagC(p.cota)}</div></div></td><td>Parcela ${p.num}</td><td style="font-weight:600;color:var(--navy2)">${fmtM(p.valor)}</td><td><span class="badge ${sc}">${sl}</span></td></tr>`;}).join('');
  tbl.innerHTML=`<thead><tr><th>Data</th><th style="width:180px">Cliente</th><th>Parcela</th><th>Valor</th><th>Status</th></tr></thead><tbody>${rows}</tbody>`;
  card.style.display='block';card.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderCalculos(){
  const vendas=S.vendas;const clientes=S.clientes;
  if(!vendas.length)return`<div class="card"><div class="card-body"><div class="empty">🧮<br><br>Cadastre vendas para ver os cálculos.</div></div></div>`;

  const todasP=vendas.flatMap(v=>S.parcelas[v.id]||[]);
  const parcelasDoMes=todasP.filter(p=>p.data_venc?.startsWith(mes));
  const mesPago=parcelasDoMes.filter(p=>p.status==='recebido').length;
  const mesPend=parcelasDoMes.filter(p=>p.status==='pendente').length;
  const mesTotal=parcelasDoMes.length;
  const mesPct=mesTotal?Math.round(mesPago/mesTotal*100):0;
  const mesValPago=parcelasDoMes.filter(p=>p.status==='recebido').reduce((a,p)=>a+p.valor,0);
  const mesValPend=parcelasDoMes.filter(p=>p.status==='pendente').reduce((a,p)=>a+p.valor,0);
  const mesValTotal=parcelasDoMes.reduce((a,p)=>a+p.valor,0);
  const totalParc=todasP.length;const totalRec=todasP.filter(p=>p.status==='recebido').length;const totalPend=todasP.filter(p=>p.status==='pendente').length;
  const pctRec=totalParc?Math.round(totalRec/totalParc*100):0;const pctPend=totalParc?Math.round(totalPend/totalParc*100):0;
  const valRec=todasP.filter(p=>p.status==='recebido').reduce((a,p)=>a+p.valor,0);const valPend=todasP.filter(p=>p.status==='pendente').reduce((a,p)=>a+p.valor,0);const valTotal=todasP.reduce((a,p)=>a+p.valor,0);
  const vendasDoMes=vendas.filter(v=>(S.parcelas[v.id]||[]).some(p=>p.data_venc?.startsWith(mes)));
  const linhas=vendasDoMes.map(v=>{
    const cli=clientes.find(c=>c.id===v.cliente_id);const parcMes=(S.parcelas[v.id]||[]).filter(p=>p.data_venc?.startsWith(mes));
    const recMes=parcMes.filter(p=>p.status==='recebido').length;const pendMes=parcMes.filter(p=>p.status==='pendente').length;const totalMes=parcMes.length;
    const pct=Math.round(recMes/totalMes*100);const circCls=pct===100?'circ-g':pct===0?'circ-r':'circ-a';
    const ind=getIndicador(S.parcelas[v.id]||[]);
    return `<div class="calc-row">
      <div class="nc"><div class="nc-n"><span class="ind ${ind.cls}" title="${ind.title}"></span>${v.nome_cliente}</div><div class="nc-t">${tagG(cli?.grupo)}${tagC(cli?.cota)}</div></div>
      <div style="text-align:center"><div class="circ ${circCls}">${pct}%</div><div style="font-size:10px;color:var(--text3);margin-top:3px">pago</div></div>
      <div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--green)">${recMes}</div><div style="font-size:10px;color:var(--text3)">pago(s)</div><div style="font-size:11px;color:var(--green)">${fmtM(parcMes.filter(p=>p.status==='recebido').reduce((a,p)=>a+p.valor,0))}</div></div>
      <div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--red)">${pendMes}</div><div style="font-size:10px;color:var(--text3)">pendente(s)</div><div style="font-size:11px;color:var(--red)">${fmtM(parcMes.filter(p=>p.status==='pendente').reduce((a,p)=>a+p.valor,0))}</div></div>
      <div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--text2)">${totalMes}</div><div style="font-size:10px;color:var(--text3)">no mês</div><div style="font-size:11px;color:var(--text2)">${fmtM(parcMes.reduce((a,p)=>a+p.valor,0))}</div></div>
      <div><div class="prog"><div class="prog-fill pf-g" style="width:${pct}%"></div></div><div style="font-size:10px;color:var(--text3);margin-top:3px">${recMes} de ${totalMes} pagos</div></div>
    </div>`;}).join('');
  return `
    <div class="mes-banner">
      <div><div class="mes-title">📅 ${nomeMes(mes)}</div><div class="mes-sub">${mesTotal} boleto${mesTotal!==1?'s':''} neste mês · ${mesPct}% recebido</div><div class="mes-bar"><div class="mes-bar-fill" style="width:${mesPct}%"></div></div></div>
      <div class="mes-valor"><div class="mes-valor-label">A receber este mês</div><div class="mes-valor-num">${fmtM(mesValPend)}</div><div class="mes-valor-sub">Recebido: ${fmtM(mesValPago)}</div></div>
    </div>
    <div class="calc-grid">
      <div class="calc-card"><div class="calc-label">BOLETOS PAGOS — ${nomeMes(mes).toUpperCase()}</div><div class="calc-value" style="color:var(--green)">${mesPago}</div><div class="calc-sub">${fmtM(mesValPago)}</div><div class="calc-pct cp-g">${mesPct}% do mês</div><div class="prog" style="margin-top:10px"><div class="prog-fill pf-g" style="width:${mesPct}%"></div></div></div>
      <div class="calc-card"><div class="calc-label">BOLETOS PENDENTES — ${nomeMes(mes).toUpperCase()}</div><div class="calc-value" style="color:var(--red)">${mesPend}</div><div class="calc-sub">${fmtM(mesValPend)}</div><div class="calc-pct cp-r">${mesTotal?Math.round(mesPend/mesTotal*100):0}% do mês</div><div class="prog" style="margin-top:10px"><div class="prog-fill" style="width:${mesTotal?Math.round(mesPend/mesTotal*100):0}%;background:var(--red)"></div></div></div>
      <div class="calc-card"><div class="calc-label">TOTAL DO MÊS</div><div class="calc-value" style="color:var(--navy2)">${mesTotal}</div><div class="calc-sub">${fmtM(mesValTotal)}</div><div class="calc-pct cp-b">em ${vendasDoMes.length} venda${vendasDoMes.length!==1?'s':''}</div><div class="prog" style="margin-top:10px"><div class="prog-fill pf-b" style="width:100%"></div></div></div>
    </div>
    ${vendasDoMes.length?`
    <div class="card">
      <div class="card-header"><div class="card-title">📋 Detalhe por venda — ${nomeMes(mes)}</div>${legend()}</div>
      <div class="calc-head"><span>Cliente</span><span style="text-align:center">% Pago</span><span style="text-align:center">Pagos</span><span style="text-align:center">Pendentes</span><span style="text-align:center">Total</span><span>Progresso</span></div>
      ${linhas}
    </div>`:''}
    <div class="sec-title">📊 Resumo geral — todas as vendas</div>
    <div class="calc-grid">
      <div class="calc-card"><div class="calc-label">TOTAL PAGO (GERAL)</div><div class="calc-value" style="color:var(--green)">${totalRec}</div><div class="calc-sub">${fmtM(valRec)}</div><div class="calc-pct cp-g">${pctRec}% do total</div><div class="prog" style="margin-top:10px"><div class="prog-fill pf-g" style="width:${pctRec}%"></div></div></div>
      <div class="calc-card"><div class="calc-label">TOTAL PENDENTE (GERAL)</div><div class="calc-value" style="color:var(--red)">${totalPend}</div><div class="calc-sub">${fmtM(valPend)}</div><div class="calc-pct cp-r">${pctPend}% do total</div><div class="prog" style="margin-top:10px"><div class="prog-fill" style="width:${pctPend}%;background:var(--red)"></div></div></div>
      <div class="calc-card"><div class="calc-label">TOTAL DE BOLETOS (GERAL)</div><div class="calc-value" style="color:var(--navy2)">${totalParc}</div><div class="calc-sub">${fmtM(valTotal)}</div><div class="calc-pct cp-a">em ${vendas.length} venda${vendas.length!==1?'s':''}</div><div class="prog" style="margin-top:10px"><div class="prog-fill pf-b" style="width:100%"></div></div></div>
    </div>`;
}

// =============================================
// PAINEL ADMIN
// =============================================
async function renderAdmin(){
  const r = await api('iplan_usuarios?order=criado_em.desc&select=*');
  const usuarios = r.ok ? await r.json() : [];

  const rows = usuarios.map(u=>{
    const dias = diffDays(u.data_expiracao);
    const stCls = u.status==='ativo'?'status-ativo':u.status==='bloqueado'?'status-bloqueado':u.status==='expirado'?'status-expirado':'status-pendente';
    const stLabel = u.status==='ativo'?'Ativo':u.status==='bloqueado'?'Bloqueado':u.status==='pendente'?'Pendente':'Expirado';
    return `<tr>
      <td style="font-weight:600">${u.nome||'—'}</td>
      <td>${u.login||'—'}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="chave-mono" style="font-size:12px">${u.chave}</span>
          <button onclick="copiarChave('${u.chave}',this)" style="background:var(--gray);border:1px solid var(--gray2);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:'Sora',sans-serif;color:var(--text2);white-space:nowrap;transition:all .2s" title="Copiar chave">📋 Copiar</button>
        </div>
      </td>
      <td>${u.plano==='3meses'?'3 Meses':u.plano==='6meses'?'6 Meses':'1 Ano'}</td>
      <td>${fmtD(u.data_expiracao)} ${dias<0?`<span style="color:var(--red);font-size:11px">(${Math.abs(dias)}d atraso)</span>`:dias<=30?`<span style="color:var(--amber);font-size:11px">(${dias}d)</span>`:''}</td>
      <td><span class="badge ${stCls}">${stLabel}</span></td>
      <td><div class="actions">
        ${u.status==='pendente'?`<button class="btn btn-sm btn-green" onclick="adminAtivar(${u.id},'${u.plano}')">✅ Ativar</button>`:''}
        ${u.status==='ativo'?`<button class="btn btn-sm" style="background:var(--amber2);color:var(--amber)" onclick="adminRenovar(${u.id},'${u.plano}')">🔄 Renovar</button>`:''}
        ${u.status!=='bloqueado'?`<button class="btn btn-sm btn-danger" onclick="adminBloquear(${u.id})">🔒 Bloquear</button>`:''}
        ${u.status==='bloqueado'?`<button class="btn btn-sm btn-primary" onclick="adminDesbloquear(${u.id})">🔓 Desbloquear</button>`:''}
      </div></td>
    </tr>`;}).join('');

  const total = usuarios.length;
  const ativos = usuarios.filter(u=>u.status==='ativo').length;
  const pendentes = usuarios.filter(u=>u.status==='pendente').length;
  const bloqueados = usuarios.filter(u=>u.status==='bloqueado').length;

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-icon">⚙️</div>
        <div>
          <div class="topbar-title">iPlan Gestão <span class="admin-badge">ADMIN</span></div>
          <div class="topbar-user">Painel de administração</div>
        </div>
      </div>
      <button class="btn-logout" onclick="S.tela='ativacao';render()">Sair</button>
    </div>
    <div class="content">
      <div class="stats">
        <div class="stat"><div class="stat-label">TOTAL DE LICENÇAS</div><div class="stat-value b">${total}</div></div>
        <div class="stat"><div class="stat-label">ATIVAS</div><div class="stat-value g">${ativos}</div></div>
        <div class="stat"><div class="stat-label">PENDENTES</div><div class="stat-value a">${pendentes}</div></div>
        <div class="stat"><div class="stat-label">BLOQUEADAS</div><div class="stat-value r">${bloqueados}</div></div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">🔑 Gerar nova chave</div></div>
        <div class="card-body">
          <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end">
            <div class="field-s"><label>Nome do cliente</label><input type="text" id="admin-nome" placeholder="Ex: João Silva" /></div>
            <div class="field-s"><label>Plano</label>
              <select id="admin-plano">
                <option value="3meses">3 Meses — R$97</option>
                <option value="6meses">6 Meses — R$167</option>
                <option value="1ano">1 Ano — R$297</option>
              </select>
            </div>
            <div class="field-s"><label>Chave gerada</label>
              <input type="text" id="admin-chave-preview" class="chave-input" readonly style="background:var(--gray);cursor:default" placeholder="Clique em gerar →" />
            </div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-primary" onclick="adminGerarChave()">🔑 Gerar</button>
              <button class="btn btn-green" onclick="adminSalvarChave()">💾 Salvar</button>
            </div>
          </div>
          <div class="form-err" id="admin-err"></div>
          <div style="font-size:12px;color:var(--text3);margin-top:8px">1. Clique em "Gerar" para criar a chave · 2. Clique em "Salvar" para registrar no sistema · 3. Envie a chave ao cliente pelo WhatsApp</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">👥 Todos os usuários</div></div>
        <div class="table-wrap"><table>
          <thead><tr><th style="width:130px">Nome</th><th>Login</th><th style="width:240px">Chave</th><th>Plano</th><th>Expira</th><th>Status</th><th style="width:220px">Ações</th></tr></thead>
          <tbody>${rows||`<tr><td colspan="7"><div class="empty">Nenhum usuário cadastrado</div></td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
}

let chaveTemp = null;
function adminGerarChave(){
  chaveTemp = gerarChave();
  const inp = document.getElementById('admin-chave-preview');
  if(inp) inp.value = chaveTemp;
}

async function adminSalvarChave(){
  const nome = document.getElementById('admin-nome')?.value.trim();
  const plano = document.getElementById('admin-plano')?.value;
  const err = document.getElementById('admin-err');
  err.style.display='none';
  if(!nome){err.textContent='Informe o nome do cliente.';err.style.display='block';return;}
  if(!chaveTemp){err.textContent='Clique em "Gerar" primeiro.';err.style.display='block';return;}

  const mesesMap = {'3meses':3,'6meses':6,'1ano':12};
  const expiracao = addMonths(today(), mesesMap[plano]);
  const r = await api('iplan_usuarios',{
    method:'POST',
    body:JSON.stringify({nome, login:'', senha:'', plano, data_inicio:today(), data_expiracao:expiracao, status:'pendente', chave:chaveTemp, device_id:''})
  });
  if(!r.ok){err.textContent='Erro ao salvar chave.';err.style.display='block';return;}
  chaveTemp=null;
  document.getElementById('admin-nome').value='';
  document.getElementById('admin-chave-preview').value='';
  renderAdmin();
}

async function adminAtivar(id, plano){
  const mesesMap = {'3meses':3,'6meses':6,'1ano':12};
  const expiracao = addMonths(today(), mesesMap[plano]);
  document.getElementById('admin-action-title').textContent = '✅ Ativar licença';
  document.getElementById('admin-action-msg').textContent = `Ativar esta licença? O acesso será liberado imediatamente com expiração em ${fmtD(expiracao)}.`;
  document.getElementById('admin-action-ok').onclick = async()=>{
    await api(`iplan_usuarios?id=eq.${id}`,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({status:'ativo',data_expiracao:expiracao})});
    closeModal('modal-admin-action');renderAdmin();
  };
  document.getElementById('modal-admin-action').classList.add('open');
}

async function adminRenovar(id, plano){
  const mesesMap = {'3meses':3,'6meses':6,'1ano':12};
  const expiracao = addMonths(today(), mesesMap[plano]);
  document.getElementById('admin-action-title').textContent = '🔄 Renovar licença';
  document.getElementById('admin-action-msg').textContent = `Renovar este plano? A nova data de expiração será ${fmtD(expiracao)}.`;
  document.getElementById('admin-action-ok').onclick = async()=>{
    await api(`iplan_usuarios?id=eq.${id}`,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({data_expiracao:expiracao})});
    closeModal('modal-admin-action');renderAdmin();
  };
  document.getElementById('modal-admin-action').classList.add('open');
}

async function adminBloquear(id){
  document.getElementById('admin-action-title').textContent = '🔒 Bloquear acesso';
  document.getElementById('admin-action-msg').textContent = 'Tem certeza que deseja bloquear este usuário? O acesso será removido imediatamente.';
  document.getElementById('admin-action-ok').className = 'btn btn-danger';
  document.getElementById('admin-action-ok').onclick = async()=>{
    await api(`iplan_usuarios?id=eq.${id}`,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({status:'bloqueado'})});
    closeModal('modal-admin-action');renderAdmin();
  };
  document.getElementById('modal-admin-action').classList.add('open');
}

async function adminDesbloquear(id){
  document.getElementById('admin-action-title').textContent = '🔓 Desbloquear acesso';
  document.getElementById('admin-action-msg').textContent = 'Reativar o acesso deste usuário?';
  document.getElementById('admin-action-ok').className = 'btn btn-green';
  document.getElementById('admin-action-ok').onclick = async()=>{
    await api(`iplan_usuarios?id=eq.${id}`,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({status:'ativo'})});
    closeModal('modal-admin-action');renderAdmin();
  };
  document.getElementById('modal-admin-action').classList.add('open');
}

function copiarChave(chave, btn){
  navigator.clipboard.writeText(chave).then(()=>{
    const original = btn.innerHTML;
    btn.innerHTML = '✅ Copiado!';
    btn.style.background = 'var(--green2)';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = '#b5dfc9';
    setTimeout(()=>{ btn.innerHTML = original; btn.style.background=''; btn.style.color=''; btn.style.borderColor=''; }, 2000);
  }).catch(()=>{
    prompt('Copie a chave abaixo:', chave);
  });
}

// =============================================
// INICIAR
// =============================================
render();
</script>
</body>
</html>
